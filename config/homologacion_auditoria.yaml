    valores: {"1": "01", "2": "01"}
    destino_valido: ["01", "02", "03", "04", "05"]
  tipo_otro_servicio:
    valores: {"1": "01", "2": "02", "3": "03", "4": "04"}

hojas:
  - nombre: Transacciones
    origen: AF
    columnas:
      - {destino: numDocumentoIdObligado, origen: num_id_prestador}
      - {destino: numFactura, origen: num_factura}
      - {destino: tipoNota, constante: ""}
      - {destino: numNota, constante: ""}
      - {destino: codPrestador, origen: cod_prestador}
      - {destino: razonSocialPrestador, origen: razon_social}
      - {destino: fechaExpedicion, origen: fecha_expedicion, transformacion: fecha_iso}
      - {destino: fechaInicioPeriodo, origen: fecha_inicio, transformacion: fecha_iso}
      - {destino: fechaFinPeriodo, origen: fecha_final, transformacion: fecha_iso}
      - {destino: codEntidadAdministradora, origen: cod_entidad}
      - {destino: nombreEntidadAdministradora, origen: nombre_entidad}
      - {destino: numContrato, origen: num_contrato}
      - {destino: planBeneficios, origen: plan_beneficios}
      - {destino: numPoliza, origen: num_poliza}
      - {destino: valorCopago, origen: valor_copago, transformacion: numero, por_defecto: "0"}
      - {destino: valorComision, origen: valor_comision, transformacion: numero, por_defecto: "0"}
      - {destino: valorDescuentos, origen: valor_descuentos, transformacion: numero, por_defecto: "0"}
      - {destino: valorNetoPagar, origen: valor_neto, transformacion: numero}

  - nombre: Usuarios
    origen: US
    unicos_por: [tipoDocumentoIdentificacion, numDocumentoIdentificacion, _remision]
    columnas:
      - {destino: tipoDocumentoIdentificacion, origen: tipo_id_usuario}
      - {destino: numDocumentoIdentificacion, origen: num_id_usuario}
      - {destino: tipoUsuario, origen: tipo_usuario, tabla: tipo_usuario}
      - {destino: "fechaNacimiento (yyyy-MM-dd)", constante: ""}
      - {destino: "codSexo (M/F)", origen: sexo}
      - {destino: codPaisResidencia, constante: "170"}
      - {destino: "codMunicipioResidencia (5 dig)", plantilla: "{cod_departamento:0>2}{cod_municipio:0>3}"}
      - {destino: codZonaTerritorialResidencia, origen: zona, tabla: zona}
      - {destino: "incapacidad (SI/NO)", constante: "NO"}
      - {destino: codPaisOrigen, constante: "170"}

  - nombre: Consultas
    origen: AC
    columnas:
      - {destino: "tipoDocumentoIdentificacion (FK Usuarios)", origen: tipo_id_usuario}
      - {destino: "numDocumentoIdentificacion (FK Usuarios)", origen: num_id_usuario}
      - {destino: codPrestador, origen: cod_prestador}
      - {destino: "fechaInicioAtencion (yyyy-MM-dd HH:mm)", origen: fecha_consulta, transformacion: fecha_hora_iso}
      - {destino: "numAutorizacion (opcional)", origen: num_autorizacion}
      - {destino: "codConsulta (CUPS)", origen: cod_consulta}
      - {destino: modalidadGrupoServicioTecSal, constante: ""}
      - {destino: grupoServicios, constante: ""}
      - {destino: codServicio, constante: ""}
      - {destino: finalidadTecnologiaSalud, origen: finalidad, tabla: finalidad_consulta}
      - {destino: causaMotivoAtencion, origen: causa_externa, tabla: causa_externa}
      - {destino: codDiagnosticoPrincipal, origen: dx_principal, transformacion: mayusculas}
      - {destino: "codDiagnosticoRelacionado1 (opcional)", origen: dx_relacionado1, transformacion: mayusculas}
      - {destino: "codDiagnosticoRelacionado2 (opcional)", origen: dx_relacionado2, transformacion: mayusculas}
      - {destino: "codDiagnosticoRelacionado3 (opcional)", origen: dx_relacionado3, transformacion: mayusculas}
      - {destino: tipoDiagnosticoPrincipal, origen: tipo_dx_principal, tabla: tipo_diagnostico}
      - {destino: tipoDocumentoIdentificacionProf, constante: ""}
      - {destino: numDocumentoIdentificacionProf, constante: ""}
      - {destino: vrServicio, origen: valor_consulta, transformacion: numero}
      - {destino: conceptoRecaudo, condicional: {campo: valor_cuota_moderadora, mayor_que: 0, entonces: "02", si_no: "05"}}
      - {destino: valorPagoModerador, origen: valor_cuota_moderadora, transformacion: numero, por_defecto: "0"}
      - {destino: "numFEVPagoModerador (opcional)", constante: ""}
      - {destino: numFactura, origen: num_factura}
      - {destino: valorNetoRIPS, origen: valor_neto, transformacion: numero}

  - nombre: Procedimientos
    origen: AP
    columnas:
      - {destino: "tipoDocumentoIdentificacion (FK Usuarios)", origen: tipo_id_usuario}
      - {destino: "numDocumentoIdentificacion (FK Usuarios)", origen: num_id_usuario}
      - {destino: codPrestador, origen: cod_prestador}
      - {destino: "fechaInicioAtencion (yyyy-MM-dd HH:mm)", origen: fecha_procedimiento, transformacion: fecha_hora_iso}
      - {destino: "idMIPRES (opcional)", constante: ""}
      - {destino: "numAutorizacion (opcional)", origen: num_autorizacion}
      - {destino: "codProcedimiento (CUPS)", origen: cod_procedimiento}
      - {destino: viaIngresoServicioSalud, origen: ambito, tabla: via_ingreso_ambito}
      - {destino: modalidadGrupoServicioTecSal, constante: ""}
      - {destino: grupoServicios, constante: ""}
      - {destino: codServicio, constante: ""}
      - {destino: finalidadTecnologiaSalud, origen: finalidad, tabla: finalidad_procedimiento}
      - {destino: tipoDocumentoIdentificacionProf, constante: ""}
      - {destino: numDocumentoIdentificacionProf, constante: ""}
      - {destino: codDiagnosticoPrincipal, origen: dx_principal, transformacion: mayusculas}
      - {destino: "codDiagnosticoRelacionado (opcional)", origen: dx_relacionado, transformacion: mayusculas}
      - {destino: "codComplicacion (opcional)", origen: dx_complicacion, transformacion: mayusculas}
      - {destino: vrServicio, origen: valor, transformacion: numero}
      - {destino: conceptoRecaudo, constante: "05"}
      - {destino: valorPagoModerador, constante: "0"}
      - {destino: "numFEVPagoModerador (opcional)", constante: ""}
      - {destino: numFactura, origen: num_factura}

  - nombre: Medicamentos
    origen: AM
    columnas:
      - {destino: "tipoDocumentoIdentificacion (FK Usuarios)", origen: tipo_id_usuario}
      - {destino: "numDocumentoIdentificacion (FK Usuarios)", origen: num_id_usuario}
      - {destino: "codPrestador (opcional)", origen: cod_prestador}
      - {destino: "numAutorizacion (opcional)", origen: num_autorizacion}
      - {destino: "idMIPRES (opcional)", constante: ""}
      - {destino: "fechaDispensAdmon (yyyy-MM-dd HH:mm)", origen: af_fecha_inicio, transformacion: fecha_hora_iso}
      - {destino: codDiagnosticoPrincipal, constante: ""}
      - {destino: "codDiagnosticoRelacionado (opcional)", constante: ""}
      - {destino: tipoMedicamento, origen: tipo_medicamento, tabla: tipo_medicamento}
      - {destino: codTecnologiaSalud, origen: cod_medicamento}
      - {destino: nomTecnologiaSalud, origen: nombre_generico}
      - {destino: concentracionMedicamento, origen: concentracion}
      - {destino: unidadMedida, origen: unidad_medida}
      - {destino: "formaFarmaceutica (opcional)", origen: forma_farmaceutica}
      - {destino: unidadMinDispensa, constante: ""}
      - {destino: cantidadMedicamento, origen: num_unidades, transformacion: numero}
      - {destino: diasTratamiento, constante: ""}
      - {destino: tipoDocumentoIdentificacionProf, constante: ""}
      - {destino: numDocumentoIdentificacionProf, constante: ""}
      - {destino: vrUnitMedicamento, origen: valor_unitario, transformacion: numero}
      - {destino: vrServicio, origen: valor_total, transformacion: numero}
      - {destino: conceptoRecaudo, constante: "05"}
      - {destino: valorPagoModerador, constante: "0"}
      - {destino: "numFEVPagoModerador (opcional)", constante: ""}
      - {destino: numFactura, origen: num_factura}

  - nombre: Hospitalizaciones
    origen: AH
    columnas:
      - {destino: "tipoDocumentoIdentificacion (FK Usuarios)", origen: tipo_id_usuario}
      - {destino: "numDocumentoIdentificacion (FK Usuarios)", origen: num_id_usuario}
      - {destino: "codPrestador (opcional)", origen: cod_prestador}
      - {destino: viaIngresoServicioSalud, origen: via_ingreso, tabla: via_ingreso_hospital}
      - {destino: "fechaInicioAtencion (yyyy-MM-dd HH:mm)", origen: fecha_ingreso, transformacion: fecha_hora_iso, hora: hora_ingreso}
      - {destino: "numAutorizacion (opcional)", origen: num_autorizacion}
      - {destino: causaMotivoAtencion, origen: causa_externa, tabla: causa_externa}
      - {destino: codDiagnosticoPrincipal, origen: dx_ingreso, transformacion: mayusculas}
      - {destino: codDiagnosticoPrincipalE, origen: dx_egreso, transformacion: mayusculas}
      - {destino: "codDiagnosticoRelacionadoE1 (opcional)", origen: dx_relacionado1, transformacion: mayusculas}
      - {destino: "codDiagnosticoRelacionadoE2 (opcional)", origen: dx_relacionado2, transformacion: mayusculas}
      - {destino: "codDiagnosticoRelacionadoE3 (opcional)", origen: dx_relacionado3, transformacion: mayusculas}
      - {destino: "codComplicacion (opcional)", origen: dx_complicacion, transformacion: mayusculas}
      - {destino: condicionDestinoUsuarioEgreso, origen: estado_salida, tabla: estado_hospitalizacion}
      - {destino: "codDiagnosticoCausaMuerte (opcional)", origen: causa_muerte, transformacion: mayusculas}
      - {destino: "fechaEgreso (yyyy-MM-dd HH:mm)", origen: fecha_egreso, transformacion: fecha_hora_iso, hora: hora_egreso}
      - {destino: numFactura, origen: num_factura}

  - nombre: Urgencias
    origen: AU
    columnas:
      - {destino: "tipoDocumentoIdentificacion (FK Usuarios)", origen: tipo_id_usuario}
      - {destino: "numDocumentoIdentificacion (FK Usuarios)", origen: num_id_usuario}
      - {destino: codPrestador, origen: cod_prestador}
      - {destino: "fechaInicioAtencion (yyyy-MM-dd HH:mm)", origen: fecha_ingreso, transformacion: fecha_hora_iso, hora: hora_ingreso}
      - {destino: causaMotivoAtencion, origen: causa_externa, tabla: causa_externa}
      # La 3374 sólo reporta diagnóstico a la salida: se usa como principal de ingreso y de egreso.
      - {destino: codDiagnosticoPrincipal, origen: dx_salida, transformacion: mayusculas}
      - {destino: codDiagnosticoPrincipalE, origen: dx_salida, transformacion: mayusculas}
      - {destino: "codDiagnosticoRelacionadoE1 (opcional)", origen: dx_relacionado1, transformacion: mayusculas}
      - {destino: "codDiagnosticoRelacionadoE2 (opcional)", origen: dx_relacionado2, transformacion: mayusculas}
      - {destino: "codDiagnosticoRelacionadoE3 (opcional)", origen: dx_relacionado3, transformacion: mayusculas}
      - {destino: condicionDestinoUsuarioEgreso, plantilla: "{estado_salida}{destino_salida}", tabla: destino_urgencias}
      - {destino: "codDiagnosticoCausaMuerte (opcional)", origen: causa_muerte, transformacion: mayusculas}
      - {destino: "fechaEgreso (yyyy-MM-dd HH:mm)", origen: fecha_salida, transformacion: fecha_hora_iso, hora: hora_salida}
      - {destino: numFactura, origen: num_factura}

  - nombre: RecienNacidos
    origen: AN
    columnas:
      - {destino: "tipoDocumentoIdentificacion (FK Usuarios - madre)", origen: tipo_id_madre}
      - {destino: "numDocumentoIdentificacion (FK Usuarios - madre)", origen: num_id_madre}
      - {destino: "codPrestador (opcional)", origen: cod_prestador}
      - {destino: tipoDocumentoIdentificacionRN, constante: ""}
      - {destino: numDocumentoIdentificacionRN, constante: ""}
      - {destino: "fechaNacimientoRN (yyyy-MM-dd HH:mm)", origen: fecha_nacimiento, transformacion: fecha_hora_iso, hora: hora_nacimiento}
      - {destino: "edadGestacional (semanas)", origen: edad_gestacional, transformacion: numero}
      - {destino: numConsultasCPrenatal, origen: control_prenatal, tabla: control_prenatal}
      - {destino: "codSexoBiologico (M/F/I)", origen: sexo}
      - {destino: "peso (gramos)", origen: peso, transformacion: numero}
      - {destino: codDiagnosticoPrincipal, origen: dx_recien_nacido, transformacion: mayusculas}
      - {destino: condicionDestinoUsuarioEgreso, condicional: {campo: causa_muerte, no_vacio: true, entonces: "02", si_no: "01"}}
      - {destino: "codDiagnosticoCausaMuerte (opcional)", origen: causa_muerte, transformacion: mayusculas}
      - {destino: "fechaEgreso (yyyy-MM-dd HH:mm)", origen: fecha_muerte, transformacion: fecha_hora_iso, hora: hora_muerte}
      - {destino: numFactura, origen: num_factura}

  - nombre: OtrosServicios
    origen: AT
    columnas:
      - {destino: "tipoDocumentoIdentificacion (FK Usuarios)", origen: tipo_id_usuario}
      - {destino: "numDocumentoIdentificacion (FK Usuarios)", origen: num_id_usuario}
      - {destino: "codPrestador (opcional)", origen: cod_prestador}
      - {destino: "numAutorizacion (opcional)", origen: num_autorizacion}
      - {destino: "idMIPRES (opcional)", constante: ""}
      - {destino: "fechaSuministroTecnologia (yyyy-MM-dd HH:mm)", origen: af_fecha_inicio, transformacion: fecha_hora_iso}
      - {destino: tipoOS, origen: tipo_servicio, tabla: tipo_otro_servicio}
      - {destino: codTecnologiaSalud, origen: cod_servicio}
      - {destino: nomTecnologiaSalud, origen: nombre_servicio}
      - {destino: cantidadOS, origen: cantidad, transformacion: numero}
      - {destino: tipoDocumentoIdentificacionProf, constante: ""}
      - {destino: numDocumentoIdentificacionProf, constante: ""}
      - {destino: vrUnitOS, origen: valor_unitario, transformacion: numero}
      - {destino: vrServicio, origen: valor_total, transformacion: numero}
      - {destino: conceptoRecaudo, constante: "05"}
      - {destino: valorPagoModerador, constante: "0"}
      - {destino: "numFEVPagoModerador (opcional)", constante: ""}
      - {destino: numFactura, origen: num_factura}
