# =============================================================================
# Homologación RIPS (Res. 3374/2000) -> herramienta de auditoría financiera
# =============================================================================
# Perfil por defecto: "Plantilla_RIPS_Servicios" (plantilla de carga masiva que
# entregó la ESE; columnas idénticas a sus hojas Usuarios, Consultas,
# Procedimientos, Medicamentos, Hospitalizaciones, Urgencias, RecienNacidos y
# OtrosServicios, que siguen la Resolución 2275 de 2023). Se agrega la hoja
# "Transacciones" (cabecera de factura) y la columna numFactura en cada hoja de
# servicios, que la auditoría financiera necesita para cruzar contra cartera.
#
# Para adaptar a otra herramienta: copie este archivo, cambie nombres de hojas
# y columnas, y apúntelo en config/configuracion.yaml (homologacion.archivo_mapeo)
# o con --mapeo en la línea de comandos. Ver rips_auditoria/homologacion.py para
# la sintaxis (origen / plantilla / constante / condicional / tabla / ...).
#
# Campos disponibles: los nombres técnicos del Diccionario (hoja "Diccionario"
# del Excel), la trazabilidad (hospital, periodo, remision, archivo, linea) y,
# en hojas de servicios, los datos de su factura con prefijo af_ (af_fecha_inicio,
# af_cod_entidad, af_num_contrato, ...).
# =============================================================================

perfil: "Plantilla_RIPS_Servicios - carga masiva RIPS (Res. 2275/2023) + extensiones de auditoría"
version: "1.0"
incluir_trazabilidad: true   # agrega _hospital, _periodo, _remision, _archivo, _linea

supuestos:
  - "La Res. 3374 no reporta fecha de nacimiento, país ni incapacidad: fechaNacimiento queda vacía, codPaisResidencia y codPaisOrigen = 170 (Colombia) e incapacidad = NO."
  - "codMunicipioResidencia = código DANE departamento (2) + municipio (3) del archivo US."
  - "Zona: U (urbana) -> 02 y R (rural) -> 01, según tabla de zona territorial de la Res. 2275."
  - "Tipo de usuario 3374 -> 2275: 1 Contributivo -> 01 (cotizante, no se distingue beneficiario), 2 Subsidiado -> 04, 3 Vinculado -> 05 (no asegurado), 4 Particular -> 12, 5 Otro -> 06 (régimen especial/excepción, uso observado en Fiduprevisora)."
  - "Causa externa 3374 -> causaMotivoAtencion 2275 según tabla 'causa_externa'. Los RIPS que ya traen códigos 21-49 se conservan."
  - "Finalidad de consulta 3374 -> finalidadTecnologiaSalud 2275 según tabla 'finalidad_consulta'; 10 (No aplica) -> 44, alineado con el uso observado en los RIPS de la ESE para consultas de morbilidad. Los códigos 11-44 ya presentes se conservan."
  - "Finalidad de procedimiento: 1 Diagnóstico -> 15, 2 Terapéutico -> 16, 3 Protección específica -> 14, 4 Detección temprana enf. general -> 12, 5 Detección temprana enf. laboral -> 13."
  - "fechaInicioAtencion usa la fecha del servicio con hora 00:00 cuando la 3374 no reporta hora (AC, AP). AM y AT no tienen fecha en la 3374: se usa la fecha de inicio del período facturado (AF) como aproximación."
  - "modalidadGrupoServicioTecSal, grupoServicios, codServicio, idMIPRES y documento del profesional no existen en la 3374 y quedan vacíos; deben completarse desde el REPS / historia clínica si la herramienta los exige."
  - "conceptoRecaudo: consultas con cuota moderadora > 0 -> 02 (cuota moderadora); demás -> 05 (no aplica). El copago de la factura queda en la hoja Transacciones."
  - "Vía de ingreso (procedimientos) se deriva del ámbito 3374: 1 Ambulatorio -> 01, 2 Hospitalario -> 04, 3 Urgencias -> 03. Hospitalización: 1 Urgencias -> 03, 2 Consulta externa -> 02, 3 Remitido -> 13, 4 Nacido en la institución -> 07."
  - "condicionDestinoUsuarioEgreso: muerto -> 02; urgencias alta -> 01, remisión -> 04, hospitalización -> 03; hospitalización vivo -> 01. Verificar contra la tabla vigente de SISPRO."
  - "Recién nacidos: control prenatal 1 (Sí) -> 1 consulta (mínimo conocido), 2 (No) -> 0. Documento del RN no existe en la 3374."
  - "tipoMedicamento: POS y no POS -> 01 (medicamento con registro sanitario); tipoOS: 1 insumos -> 01, 2 traslados -> 02, 3 estancias -> 03, 4 honorarios -> 04."
  - "Códigos sin equivalencia se conservan tal cual y se reportan como HOMOLOGACION_SIN_EQUIVALENCIA."

