# REGLA NUEVA EPS (confirmada por la E.S.E., 30/10/2026): la contratación de CÁPITA es todo lo que NO dice
# EVENTO (subsidiado y contributivo); lo de evento siempre lo dice en la carpeta o en el contrato.
nueva_eps_sin_evento_es_capita: true

# Excepciones por número de contrato (campo num_contrato del AF) -> modalidad. Tienen prioridad sobre la regla
# anterior. Editable en Maestros → Contratos y modalidad.
contratos_modalidad:
  "02-02-06-00227-2016": CAPITA   # contrato cápita subsidiado (acta de terminación No. 0227)

# Contratación CÁPITA Nueva EPS (actas de negociación No. 4131 RS y RC, precontractuales, marzo 2026, sujetas a
# aprobación del Comité Nacional de Contratación). Contrato cápita subsidiado anterior: 02-02-06-00227-2016
# (acta de terminación No. 0227, mutuo acuerdo). Valor mensual = afiliados × valor costo usuario.
capita_pactada:
  acta: "Acta de negociación No. 4131 (RS 10/03/2026, RC 09/03/2026)"
  subsidiado:
    ARAUQUITA: {afiliados: 28675, valor_usuario: 40000}
    CRAVO NORTE: {afiliados: 564, valor_usuario: 45000}
    FORTUL: {afiliados: 14895, valor_usuario: 40000}
    PUERTO RONDON: {afiliados: 905, valor_usuario: 45000}
    TAME: {afiliados: 25144, valor_usuario: 40000}
  contributivo:
    CRAVO NORTE: {afiliados: 197, valor_usuario: 45000}
    FORTUL: {afiliados: 1255, valor_usuario: 45000}
    PUERTO RONDON: {afiliados: 221, valor_usuario: 45000}

# Códigos de la EPS en alcance (Nueva EPS). EPS037 = contributivo, EPSS37 = subsidiado.
# SUPUESTO: ambos se tratan como Nueva EPS (EPS037) para el análisis de cápita/evento.
eps_objetivo:
  - EPS037
  - EPSS37

# Palabras en el nombre de la carpeta de la remisión o en el número de contrato que
# indican la modalidad declarada.
modalidad_por_palabra:
  CAPITA: CAPITA
  CAPITADO: CAPITA
  PGP: PGP
  EVENTO: EVENTO
