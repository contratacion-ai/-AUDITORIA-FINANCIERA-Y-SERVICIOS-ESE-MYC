# Parámetros del análisis CAPITA / EVENTO. Edite aquí cuando cambien; los informes los citan como supuestos.
capita:
  meses_ventana: 4                 # cuatrimestre: compara los primeros meses con los últimos 4
traslados:
  codigos: [S31307, 601T02, 601T01]
  # Tope contractual mensual de traslados. PENDIENTE DE CONFIRMACIÓN (no está en los artefactos).
  tope_mensual: null
cruces:
  tolerancia_frecuencia_pct: 10    # sobreejecución NT si RIPS > previsto × (1 + 10 %)
  tolerancia_tarifa_pct: 1         # tarifa fuera de tarifario si |dif| > 1 %
  tolerancia_valor_pesos: 1
clasificacion:
  # Si un código no está en el catálogo ni en la NT, se usa la modalidad declarada por la carpeta
  # (CAPITA/EVENTO); sin ella queda EVENTO (SIN MARCA).
  modalidad_por_defecto: EVENTO
  reemplazar_medicamentos_por_despacho: false   # regla opcional del dashboard CAPITA·EVENTO
