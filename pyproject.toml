[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "rips-auditoria"
version = "1.0.0"
description = "Procesamiento de RIPS (Res. 3374 de 2000, Anexo Técnico No. 1) para auditoría financiera de la ESE Moreno y Clavijo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "openpyxl>=3.1", "XlsxWriter>=3.1", "PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
rips-auditoria = "rips_auditoria.cli:main"

[tool.setuptools]
packages = ["rips_auditoria"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 140
