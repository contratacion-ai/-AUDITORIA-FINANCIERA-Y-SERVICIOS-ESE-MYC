name: Costeo ABC Ambulancias

on:
  push:
    # Con 'tags' también hay que listar 'branches' para seguir corriendo en
    # los push a ramas. En las etiquetas no se evalúa el filtro de rutas.
    branches:
      - "**"
    tags:
      - "v*"
    paths:
      - "ambulancias_abc/**"
      - "installer/windows/**"
      - "docs/ambulancias_abc/**"
      - ".github/workflows/costeo-abc-ambulancias.yml"
  pull_request:
    paths:
      - "ambulancias_abc/**"
      - "installer/windows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pruebas:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ambulancias_abc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test -v 2

  instalador-windows:
    needs: pruebas
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inno Setup
        shell: pwsh
        run: |
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
      - name: Construir instalador
        shell: pwsh
        run: |
          $v = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart("v") } else { "1.0.${{ github.run_number }}" }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          ./installer/windows/build_installer.ps1 -Version $v
      - name: Probar instalador (para todos, silencioso, sin credenciales)
        shell: pwsh
        run: |
          $exe = (Get-ChildItem installer/windows/salida/*.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/ALLUSERS','/LOG=instalacion_todos.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content instalacion_todos.log -Tail 50; throw "El instalador terminó con código $($p.ExitCode)" }
          $datos = "$env:ProgramData\CosteoABCAmbulancias"
          ./installer/windows/probar_instalacion.ps1 -Url "http://localhost:8000" -DirDatos $datos
          Start-Process "${env:ProgramFiles}\CosteoABCAmbulancias\unins000.exe" -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES' -Wait
          if (Get-ScheduledTask -TaskName "CosteoABC-Servidor" -ErrorAction SilentlyContinue) { throw "La desinstalación no quitó la tarea del servidor" }
          Write-Host "Instalación para todos los usuarios: OK"
      - name: Probar instalador (solo para mí, sin administrador)
        # La tarea de este modo corre con la sesión interactiva del usuario, que
        # el ejecutor de GitHub no tiene; se informa sin bloquear la compilación.
        continue-on-error: true
        shell: pwsh
        run: |
          $exe = (Get-ChildItem installer/windows/salida/*.exe | Select-Object -First 1).FullName
          $p = Start-Process $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/CURRENTUSER','/PUERTO=8010','/LOG=instalacion_usuario.log' -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content instalacion_usuario.log -Tail 50; throw "El instalador terminó con código $($p.ExitCode)" }
          ./installer/windows/probar_instalacion.ps1 -Url "http://localhost:8010" -DirDatos "$env:APPDATA\CosteoABCAmbulancias"
      - uses: actions/upload-artifact@v4
        with:
          name: Instalador_CosteoABC_Ambulancias
          path: installer/windows/salida/*.exe
          retention-days: 30

  publicar-release:
    # Publica el instalador como Release (enlace de descarga permanente) cuando
    # se empuja una etiqueta v* o un commit cuyo mensaje contiene [publicar].
    if: github.event_name == 'push' && (github.ref_type == 'tag' || contains(github.event.head_commit.message, '[publicar]'))
    needs: instalador-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Instalador_CosteoABC_Ambulancias
          path: salida
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Costeo ABC Ambulancias ${{ github.ref_type == 'tag' && github.ref_name || format('v1.0.{0}', github.run_number) }}
          files: salida/*.exe
          body: |
            Instalador para Windows (servidor de red local) de Costeo ABC Ambulancias - ESE Moreno y Clavijo.

            1. Descargue `Instalador_CosteoABC_Ambulancias_*.exe` y ejecútelo en el equipo servidor. No pide usuario ni contraseña.
            2. Elija "Para todos los usuarios" (servidor para toda la red) o "Solo para mí" (sin permisos de administrador).
            3. Al terminar se muestra el usuario `admin` y su clave inicial (archivo CREDENCIALES_ADMIN.txt). Cámbiela al ingresar.
            4. Desde cualquier equipo de la red abra `http://NOMBRE-DEL-SERVIDOR:8000/`.

            Documentación: carpeta `docs` del programa instalado o `docs/ambulancias_abc/` del repositorio.
