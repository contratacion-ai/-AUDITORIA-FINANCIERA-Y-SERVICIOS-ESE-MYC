<form class="row g-2 align-items-end mb-3 no-imprimir">
  <div class="col-auto"><label class="form-label small mb-0">Periodo</label><select name="periodo" class="form-select form-select-sm">
    {% for p in periodos %}<option value="{{ p.pk }}" {% if p.pk == periodo.pk %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>
  <div class="col-auto"><label class="form-label small mb-0">Comparar con</label><select name="comparar" class="form-select form-select-sm">
    <option value="0">Sin comparación</option>
    {% for p in periodos %}<option value="{{ p.pk }}" {% if p.pk == comparar.pk %}selected{% endif %}>{{ p }}</option>{% endfor %}</select></div>
  {% if not sin_filtros_extra %}
  <div class="col-auto"><label class="form-label small mb-0">Unidad de negocio</label><select name="unidad" class="form-select form-select-sm">
    <option value="">Todas</option>{% for u in unidades %}<option value="{{ u.pk }}" {% if u.pk == unidad.pk %}selected{% endif %}>{{ u.codigo }} · {{ u.nombre|truncatechars:30 }}</option>{% endfor %}</select></div>
  <div class="col-auto"><label class="form-label small mb-0">EPS</label><select name="eps" class="form-select form-select-sm">
    <option value="">Todas</option>{% for e in lista_eps %}<option value="{{ e.pk }}" {% if e.pk == eps.pk %}selected{% endif %}>{{ e.nombre|truncatechars:30 }}</option>{% endfor %}</select></div>
  <div class="col-auto"><label class="form-label small mb-0">Ámbito</label><select name="ambito" class="form-select form-select-sm">
    <option value="">Todos</option>{% for a in ambitos %}<option value="{{ a.pk }}" {% if a.pk == ambito.pk %}selected{% endif %}>{{ a.nombre }}</option>{% endfor %}</select></div>
  {% endif %}
  {% if vista %}<input type="hidden" name="vista" value="{{ vista }}">{% endif %}
  <div class="col-auto"><button class="btn btn-sm btn-primary">Aplicar</button></div>
</form>
