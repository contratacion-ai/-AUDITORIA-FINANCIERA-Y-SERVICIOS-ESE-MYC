{% extends "base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<form method="post" class="tarjeta">
  {% csrf_token %}
  {{ form.as_p }}
  <button class="btn" type="submit">Guardar</button>
  <a class="btn sec" href="javascript:history.back()">Cancelar</a>
</form>
{% endblock %}
