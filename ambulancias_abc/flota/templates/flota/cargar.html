{% extends "flota/base.html" %}
{% block titulo %}{{ titulo }}{% endblock %}
{% block contenido %}
<h1>{{ titulo }}</h1>
<div class="panel" style="max-width:900px">
  <p class="suave">{{ ayuda }}</p>
  <form method="post" enctype="multipart/form-data" class="formulario">{% csrf_token %}
    {{ form.as_p }}
    <button type="submit">Cargar</button> <a class="boton sec" href="{% url 'flota:cargas' %}">Volver a cargas</a>
  </form>
</div>
{% endblock %}
